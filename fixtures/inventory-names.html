<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Inventory names</title>
<style>flt-semantics{display:block;width:300px;height:130px}#merged-field{display:block;width:160px;height:40px}</style>
<button id="text-button">Submit</button>
<span id="reference">Referenced action</span>
<button id="referenced-button" aria-labelledby="reference" aria-label="Ignored raw label">Different text</button>
<label for="native-input">Account name</label><input id="native-input">
<!-- Models Flutter's merged semantics DOM, not the Flutter runtime itself. -->
<flt-semantics id="merged-card" role="button" aria-label="Destination card" flt-semantics-identifier="door-card">
  <span>Visible destination</span> <span id="merged-field">Choose</span>
</flt-semantics>
</html>
