<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>browser-test-kit fixture</title>
<style>body{font-family:system-ui,sans-serif;max-width:44rem;margin:2rem auto;padding:1rem}main{border:1px solid #888;padding:1rem}label,input,button{font:inherit}#result{min-height:1.5em}</style></head>
<body><main data-testid="fixture"><h1>Browser Test Kit</h1><p id="unicode">日本語 / Unicode ✓ / 🧪</p>
<label>名前 <input id="name" autocomplete="off"></label><button id="submit" type="button">反映</button><p id="result" aria-live="polite"></p>
<script>document.querySelector('#submit').addEventListener('click',()=>{document.querySelector('#result').textContent='Hello, '+document.querySelector('#name').value+'!';});</script></main></body></html>
