name: platform-matrix

# Measure the same fixture on Windows, macOS and Linux x Chromium/Firefox/WebKit
# (+ branded Chrome/Edge) x desktop/iPhone/Pixel x headless/headed, then build one
# tabbed page to compare them (tools/platform_probe.py, issue #89).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - fixtures/platform_probe.html
      - tools/platform_probe.py
      - tools/platform_adapter.py
      - tools/platform_facts.js
      - tests/python/test_platform*
      - js.lock.json
      - vendor/js/**
      - .github/workflows/platform-matrix.yml

permissions:
  contents: read

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - name: System libraries (apt on Linux, bounded; installed before the browsers)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          uv run --locked --group browser python -m playwright install-deps chromium firefox webkit
      - name: Install browsers
        timeout-minutes: 10
        run: uv run --locked --group browser python -m playwright install chromium firefox webkit
      - name: Collect every engine, profile and mode
        shell: bash
        run: |
          status=0
          collect() { uv run --locked --group browser python tools/platform_probe.py collect --out platform-results "$@" || status=1; }
          for browser in chromium firefox webkit; do
            for profile in desktop iphone pixel; do collect --browser "$browser" --profile "$profile"; done
          done
          # The real window frame and classic scrollbars only exist with a visible window.
          for browser in chromium firefox webkit; do
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run -a uv run --locked --group browser python tools/platform_probe.py collect --browser "$browser" --headed --out platform-results || status=1
            else
              collect --browser "$browser" --headed
            fi
          done
          # Branded browsers preinstalled on the runner images; missing ones are reported, not gated.
          for channel in chrome msedge; do
            uv run --locked --group browser python tools/platform_probe.py collect --browser chromium --channel "$channel" --out platform-results \
              || echo "::warning title=platform-matrix ${{ matrix.os }}::channel $channel not measured"
          done
          # Annotations are capped per step: one notice per OS, one error per failing environment,
          # and the full list in the job summary.
          python -S tools/platform_probe.py summary platform-results > summary.txt || true
          { echo '```text'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=platform-matrix ${{ matrix.os }}::$(grep -c '^pass' summary.txt) pass, $(grep -c '^fail' summary.txt) fail"
          grep '^fail' summary.txt | sed 's/^/::error title=platform-matrix ${{ matrix.os }}::/' || true
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-${{ matrix.os }}
          path: platform-results
          if-no-files-found: error
          retention-days: 30

  matrix:
    needs: collect
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-*
          path: platform-results
      - name: Merge and render the tabbed comparison
        run: |
          python -S tools/platform_probe.py merge platform-results --out platform-matrix/dataset.json
          python -S tools/platform_probe.py render platform-matrix/dataset.json --out platform-matrix/index.html
          python -S tools/platform_probe.py summary platform-matrix/dataset.json > platform-matrix/summary.txt || true
          { echo '```text'; cat platform-matrix/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Results that live only in artifacts are unreadable after retention, from a phone, or for
      # agents without blob access (EVIDENCE_ONLY_IN_ARTIFACTS): keep one updated PR comment.
      - name: Comment the summary on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Markdown backticks are literal text, not shell command substitutions.
          # shellcheck disable=SC2016
          body="$(printf '<!-- platform-matrix -->\n### platform-matrix\n\nTabbed viewer: artifact `platform-matrix` (index.html) of [this run](%s).\n\n```text\n%s\n```\n' \
            "$RUN_URL" "$(cat platform-matrix/summary.txt)")"
          id=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- platform-matrix -->")) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            timeout 60 gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            timeout 60 gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-matrix
          path: platform-matrix
          if-no-files-found: error
          retention-days: 90
