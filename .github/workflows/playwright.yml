name: playwright-prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:node
      - name: Validate Node screenshots
        if: always()
        run: |
          find test-results -name '*.png' -print0 | xargs -0 -r python3 scripts/check_png.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: node-browser-evidence, path: test-results, if-no-files-found: warn }
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m pytest tests/python -q
