name: playwright-prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@main

  node:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:node
      - name: Validate Node screenshots
        if: always()
        run: python3 scripts/check_evidence.py test-results --pattern '**/evidence.json' --expect chromium,firefox,webkit,mobile-chromium,mobile-webkit
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: node-browser-evidence, path: test-results, if-no-files-found: error }
  python:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m pytest tests/python -q
      - name: Validate Python API screenshots
        if: always()
        run: python scripts/check_evidence.py test-results/python --pattern '*.json' --expect chromium-desktop,chromium-mobile,firefox-desktop,firefox-mobile,webkit-desktop,webkit-mobile
      - name: Python Playwright CLI screenshot
        run: |
          python -m playwright screenshot --browser=chromium --device="Desktop Chrome" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-chromium.png
          python -m playwright screenshot --browser=webkit --device="iPhone 13" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-webkit-mobile.png
          python scripts/check_png.py test-results/python-cli-chromium.png test-results/python-cli-webkit-mobile.png
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: python-browser-evidence, path: test-results, if-no-files-found: error }
      - name: Wrapper tests with btk-events plugin enabled
        run: |
          PYTHONPATH=scripts python -m pytest tests/python/test_terminal_browser_wrapper.py -p pytest_btk_events --btk-events test-results/btk-events.jsonl --btk-events-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Evidence board
        if: always()
        run: python scripts/evidence_board.py test-results/btk-events.jsonl --step-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: btk-events, path: test-results/btk-events.jsonl }
      - name: Scripts install and run as modules (python -m)
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m check_png --help
