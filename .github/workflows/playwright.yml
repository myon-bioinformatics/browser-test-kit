name: playwright-prototype
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e

  node-browserless:
    name: Node document comparisons (no browser)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - run: npm ci --ignore-scripts
      - run: npm run test:browserless
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-node-browserless
          path: test-results/junit/browserless-node.xml
          if-no-files-found: error
          retention-days: 14

  node:
    needs: [changes, python, node-browserless, test-locked]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - run: npm run test:node
      - name: Validate Node screenshots
        if: always()
        run: python3 scripts/check_evidence.py test-results --pattern '**/evidence.json' --expect chromium,firefox,webkit,mobile-chromium,mobile-webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: node-browser-evidence, path: test-results, if-no-files-found: error }
  python:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: '3.13' }
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 2192ff22acafdd09e80ac722df91ee937aaedd5e
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Run Python tests with JUnit
        env:
          BTK_FAILURE_EVIDENCE: test-results/controlled-failure
        run: uv run --locked python -m pytest tests/python -q -m "not browser" --junitxml=test-results/junit/python-3.13.xml
      - name: Preserve junit-python-3.13
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-3.13
          path: test-results/junit/python-3.13.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve junit-controlled-python-3.13
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-controlled-python-3.13
          path: test-results/controlled-failure/
          if-no-files-found: error
          retention-days: 14
      - name: Wrapper tests with btk-events plugin enabled
        run: |
          PYTHONPATH=scripts uv run --locked python -m pytest tests/python/test_terminal_browser_wrapper.py -p pytest_btk_events --btk-events test-results/btk-events.jsonl --btk-events-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Evidence board
        if: always()
        run: python scripts/evidence_board.py test-results/btk-events.jsonl --step-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: btk-events, path: test-results/btk-events.jsonl }
      - name: Scripts install and run as modules (python -m)
        run: |
          cd "$RUNNER_TEMP"
          uv run --locked --no-dev --no-editable --project "$GITHUB_WORKSPACE" python -m check_png --help

      - name: Stage canonical vendor evidence
        if: always()
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind locked --output build/vendor-evidence-test
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-lock-py3.13
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  python-browser:
    name: Python browser integration
    needs: [changes, python, node-browserless, test-locked]
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { python-version: '3.13' }
      - run: uv run --locked --group browser python -m playwright install --with-deps --only-shell chromium firefox webkit
      - name: Run Python browser tests with JUnit
        run: uv run --locked --group browser python -m pytest tests/python -q -m browser --junitxml=test-results/junit/python-browser-3.13.xml
      - name: Preserve browser JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-browser-3.13
          path: test-results/junit/python-browser-3.13.xml
          if-no-files-found: error
          retention-days: 14
      - name: Validate Python API screenshots
        if: always()
        run: python scripts/check_evidence.py test-results/python --pattern '*.json' --expect chromium-desktop,chromium-mobile,firefox-desktop,firefox-mobile,webkit-desktop,webkit-mobile
      - name: Python Playwright CLI screenshot
        run: |
          uv run --locked --group browser python -m playwright screenshot --browser=chromium --device="Desktop Chrome" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-chromium.png
          uv run --locked --group browser python -m playwright screenshot --browser=webkit --device="iPhone 13" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-webkit-mobile.png
          python scripts/check_png.py test-results/python-cli-chromium.png test-results/python-cli-webkit-mobile.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-browser-evidence
          path: |
            test-results
            !test-results/junit/**
            !test-results/controlled-failure/**
          if-no-files-found: error

  test-locked:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: '3.13'
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 2192ff22acafdd09e80ac722df91ee937aaedd5e
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - run: uv run --locked python -m pytest tests/python -q -m "not browser"
    - name: Wrapper tests with btk-events plugin enabled
      run: |
        PYTHONPATH=scripts uv run --locked python -m pytest tests/python/test_terminal_browser_wrapper.py -p pytest_btk_events --btk-events test-results/btk-events.jsonl --btk-events-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
    - name: Evidence board
      if: always()
      run: python scripts/evidence_board.py test-results/btk-events.jsonl --step-summary
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: locked-btk-events
        path: test-results/btk-events.jsonl
        if-no-files-found: error
    - name: Scripts install and run as modules (python -m)
      run: |
        cd "$RUNNER_TEMP"
        uv run --locked --no-dev --no-editable --project "$GITHUB_WORKSPACE" python -m check_png --help
    - name: Stage canonical vendor evidence
      if: always()
      run: >-
        python -S .vendor-sync-tools/vendor_stage.py
        --kind locked --output build/vendor-evidence-locked
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: locked-vendor-lock-py3.13
        path: build/vendor-evidence-locked
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20


  junit-identity:
    needs: [changes, python, node-browserless, python-browser]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-python-3.13/python-3.13.xml", "junit-controlled-python-3.13/junit.xml", "junit-node-browserless/browserless-node.xml", "junit-python-browser-3.13/python-browser-3.13.xml"]'
