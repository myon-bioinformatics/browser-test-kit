name: Python support boundaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    name: Stdlib and base package / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Dependency-free source tests
        run: python -S -m unittest discover -s tests/stdlib -v
      - name: Install the base distribution with no runtime dependencies
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          python -m check_png --help
          python -c "from importlib.metadata import metadata; m = metadata('browser-test-kit-tools'); assert m['Requires-Python'] == '>=3.9'; assert all('extra ==' in r for r in m.get_all('Requires-Dist', []))"
      - name: Image extra must fail instead of choosing an older Pillow
        shell: bash
        run: |
          if python -m pip install --dry-run '.[image]' > image-install.log 2>&1; then
            cat image-install.log
            echo '::error::Image installation unexpectedly accepted unsupported Python'
            exit 1
          fi
          cat image-install.log
          grep -Ei 'No matching distribution found for pillow|Could not find a version that satisfies the requirement pillow' image-install.log

  development-floor:
    name: Images and development / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - name: Resolve all supported groups and image extra from the lock
        run: uv sync --locked --all-groups --all-extras
      - name: Full browserless regression suite at the supported floor
        run: uv run --locked python -m pytest tests/python -q -m 'not browser'
      - name: Build and inspect the distributable package
        run: |
          uv build
          uv run --locked python -m pytest tests/python/test_python_support.py -q
