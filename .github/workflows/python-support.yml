name: Python support boundaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    name: Stdlib and base package / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependency-free source tests
        run: python -S -m unittest discover -s tests/stdlib -v
      - name: Image CLI help without site packages
        run: python -S scripts/image_diff.py --help
      - name: Install the base distribution with no runtime dependencies
        run: |
          python -m pip install --no-deps .
          cd "$RUNNER_TEMP"
          python -m btk --help
          python -c "from importlib.metadata import metadata; m = metadata('browser-test-kit-tools'); assert m['Requires-Python'] == '>=3.9'; assert m.get_all('Requires-Dist', []) == []"

  development-floor:
    name: Images and development / Python 3.11
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 2192ff22acafdd09e80ac722df91ee937aaedd5e
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Resolve all supported groups from the lock
        run: uv sync --locked --all-groups
      - name: Image CLI at the supported floor
        run: python -S scripts/image_diff.py --help
      - name: Full browserless regression suite at the supported floor
        run: uv run --locked python -m pytest tests/python -q -m 'not browser'
      - name: Build and inspect the distributable package
        run: |
          uv build
          uv run --locked python -m pytest tests/python/test_python_support.py tests/python/test_legacy_entrypoints.py -q
