name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  node-browserless:
    name: Node document comparisons (no browser)
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run test:browserless
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-node-browserless
          path: test-results/junit/browserless-node.xml
          if-no-files-found: error
          retention-days: 14

  node:
    needs: [changes, python, node-browserless, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - name: Prepare and install the fixed 30-package Node browser environment
        env:
          NANO_PARENT_REV: 8ce289a78754cf8ca0ae2ca3889b52281929fdc4
          NANO_HELPER_SHA256: 349921219cfdcd8a5054df962c7132324ac7134784f73147d1e8867ab6aa01b0
        run: |
          python3 -I -B -S - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import time
          import urllib.request
          
          started = time.perf_counter()
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          target = checkout / 'node_modules'
          if target.exists() or target.is_symlink():
              raise RuntimeError('refusing to replace existing checkout node_modules')
          revision = os.environ['NANO_PARENT_REV']
          digest = os.environ['NANO_HELPER_SHA256']
          if not re.fullmatch('[0-9a-f]{40}', revision) or not re.fullmatch('[0-9a-f]{64}', digest):
              raise ValueError('expected fixed parent commit and helper SHA-256')
          work = Path(tempfile.mkdtemp(prefix='btk-node-deps-', dir=os.environ['RUNNER_TEMP'])).resolve()
          url = f'https://raw.githubusercontent.com/myon-bioinformatics/myon-bioinformatics/{revision}/tools/nano_node.py'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(2 * 1024 * 1024 + 1)
          if len(data) > 2 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
              raise ValueError('parent helper download differs from its fixed hash')
          tool = work / 'nano_node.py'
          tool.write_bytes(data)
          spec = importlib.util.spec_from_file_location('nano_node', tool)
          nano = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nano)
          prepared = nano.prepare(checkout, work / 'prepared',
                                  feature=nano.BTK_NODE26_PARSERS_FEATURE, dependencies_only=True)
          project = prepared / 'browser-test-kit'
          receipt = json.loads((prepared / 'receipt.json').read_bytes())
          if (receipt.get('dependencies_only') is not True
                  or receipt.get('application_source_staged') is not False
                  or receipt['candidate_locked_package_records'] != 30
                  or set(receipt['source_git_blobs']) != {'package.json', 'package-lock.json'}
                  or {p.name for p in project.iterdir()} != {'package.json', 'package-lock.json'}):
              raise ValueError('expected dependency-only preparation with no copied application/tests')
          snapshot = nano.read_snapshot(checkout, blobs={name: nano.BTK_NODE26_PARSERS_SOURCE_BLOBS[name]
                                       for name in ('package.json', 'package-lock.json')})
          original = json.loads(snapshot['package-lock.json'])
          manifest = json.loads(snapshot['package.json'])
          manifest['devDependencies'] = nano.BTK_NODE26_PARSERS_SELECTED
          if json.loads((project / 'package.json').read_bytes()) != manifest:
              raise ValueError('unexpected projected manifest')
          nano.validate_projection(original, json.loads((project / 'package-lock.json').read_bytes()),
                                   feature=nano.BTK_NODE26_PARSERS_FEATURE)
          preparation_seconds = time.perf_counter() - started
          for name in ('home', 'config', 'tmp', 'cache'):
              (work / name).mkdir()
          for name in ('user.npmrc', 'global.npmrc'):
              (work / name).write_text('')
          env = {'PATH': os.environ['PATH'], 'HOME': str(work / 'home'),
                 'XDG_CONFIG_HOME': str(work / 'config'), 'TMPDIR': str(work / 'tmp'),
                 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD': '1'}
          npm = shutil.which('npm')
          if not npm:
              raise RuntimeError('existing npm executable is required')
          options = ['--userconfig', str(work / 'user.npmrc'), '--globalconfig', str(work / 'global.npmrc'),
                     '--cache', str(work / 'cache')]
          install_started = time.perf_counter()
          subprocess.run([npm, 'ci', '--ignore-scripts', '--no-audit', '--no-fund', '--no-update-notifier',
                          '--registry', 'https://registry.npmjs.org/', '--fetch-retries=0',
                          '--fetch-timeout=30000', *options], cwd=project, env=env, check=True, timeout=300)
          install_seconds = time.perf_counter() - install_started
          for name, field in [('package.json', 'projected_manifest_sha256'),
                              ('package-lock.json', 'projected_lock_sha256')]:
              if hashlib.sha256((project / name).read_bytes()).hexdigest() != receipt[field]:
                  raise ValueError('npm changed a prepared input')
          listed = subprocess.run([npm, 'ls', '--all', '--parseable', '--offline', *options],
                                  cwd=project, env=env, check=True, capture_output=True, text=True, timeout=60)
          installed = {Path(line).resolve() for line in listed.stdout.splitlines() if line.strip()} - {project.resolve()}
          expected = {(project / path).resolve() for path in nano.BTK_NODE26_PARSERS_EXPECTED_PATHS}
          if installed != expected or len(installed) != 30:
              raise ValueError('installed paths differ from the reviewed 30-record closure')
          lock = json.loads((project / 'package-lock.json').read_bytes())
          for path in nano.BTK_NODE26_PARSERS_EXPECTED_PATHS:
              if json.loads((project / path / 'package.json').read_bytes())['version'] != lock['packages'][path]['version']:
                  raise ValueError('installed package version differs from the lock')
          apparent_bytes = sum(p.stat().st_size for p in (project / 'node_modules').rglob('*')
                               if p.is_file() and not p.is_symlink())
          if nano.read_snapshot(checkout, blobs={name: nano.BTK_NODE26_PARSERS_SOURCE_BLOBS[name] for name in snapshot}) != snapshot:
              raise ValueError('checkout package inputs changed during setup')
          target.symlink_to(project / 'node_modules', target_is_directory=True)
          print(json.dumps({'schema': 'nano-ci-setup/1', 'feature': nano.BTK_NODE26_PARSERS_FEATURE,
                            'dependency_only': True, 'live_checkout_tests': True,
                            'installed_package_paths': len(installed),
                            'node_modules_apparent_regular_bytes': apparent_bytes,
                            'preparation_seconds': preparation_seconds, 'npm_ci_seconds': install_seconds,
                            'setup_seconds': time.perf_counter() - started,
                            'browser_bytes_included': False, 'shared_runtime_bytes_included': False}, sort_keys=True))
          PY
      - name: Check system libraries (dry run, no changes)
        id: deps_check
        continue-on-error: true
        run: npx playwright install-deps --dry-run chromium firefox webkit
      - name: System libraries (apt, bounded; runs only when the dry run reports missing packages)
        if: steps.deps_check.outcome == 'failure'
        timeout-minutes: 8
        run: |
          sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          npx playwright install-deps chromium firefox webkit
      - name: Install browsers (first attempt)
        id: install_first
        continue-on-error: true
        timeout-minutes: 6
        run: npx playwright install --only-shell chromium firefox webkit
      - name: Install browsers (retry a stalled first attempt)
        if: steps.install_first.outcome == 'failure'
        timeout-minutes: 6
        run: npx playwright install --only-shell chromium firefox webkit
      - run: npm run test:node
      - name: Validate Node screenshots
        if: always()
        run: python3 tools/check_evidence.py test-results --pattern '**/evidence.json' --expect chromium,firefox,webkit,mobile-chromium,mobile-webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: node-browser-evidence, path: test-results, if-no-files-found: error }
  python:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Run Python tests with JUnit
        env:
          FAILURE_EVIDENCE_DIR: test-results/controlled-failure
        run: uv run --locked python -m pytest tests/python -q -m "not browser" --junitxml=test-results/junit/python-3.15.xml
      - name: Preserve junit-python-3.15
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-3.15
          path: test-results/junit/python-3.15.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve junit-controlled-python-3.15
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-controlled-python-3.15
          path: test-results/controlled-failure/
          if-no-files-found: error
          retention-days: 14
      - name: Wrapper tests with btk-events plugin enabled
        run: |
          PYTHONPATH=tools uv run --locked python -m pytest tests/python/test_terminal_browser_wrapper.py -p pytest_btk_events --btk-events test-results/btk-events.jsonl --btk-events-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Evidence board
        if: always()
        run: python tools/evidence_board.py test-results/btk-events.jsonl --step-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: btk-events, path: test-results/btk-events.jsonl }
      - name: Scripts install and run as modules (python -m)
        run: |
          cd "$RUNNER_TEMP"
          uv run --locked --no-dev --no-editable --project "$GITHUB_WORKSPACE" python -m btk --help

      - name: Stage canonical vendor evidence
        if: always()
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind locked --output build/vendor-evidence-test
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-lock-py3.15
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  python-browser:
    name: Python browser integration (Chromium)
    needs: [changes, python, node-browserless, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Install browsers (first attempt)
        id: install_first
        continue-on-error: true
        timeout-minutes: 6
        run: uv run --locked --no-dev --group browser-test python -m playwright install --only-shell chromium
      - name: Install browsers (retry a stalled first attempt)
        if: steps.install_first.outcome == 'failure'
        timeout-minutes: 6
        run: uv run --locked --no-dev --group browser-test python -m playwright install --only-shell chromium
      - name: System libraries for the headless shell (apt only when ldd reports missing ones)
        run: |
          shell=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -print -quit)
          test -n "$shell"
          libs=$(for f in "$(dirname "$shell")"/*; do ldd "$f" 2>/dev/null || true; done)
          if ! grep -q '=>' <<<"$libs" || grep -q 'not found' <<<"$libs"; then
            uv run --locked --no-dev --group browser-test python -m playwright install-deps --only-shell chromium
          else
            echo 'headless shell libraries are present; skipping apt'
          fi
      - name: Node launch tests (py_launch --site; observe, act, scenario in Chromium)
        run: |
          BTK_PYTHON="$(uv run --locked --no-dev --group browser-test python -c 'import sys; print(sys.executable)')"
          export BTK_PYTHON
          BTK_REQUIRE_PLAYWRIGHT=1 node --test tests/node-unit/page_inspect.test.mjs tests/node-launch/btk_playwright.test.mjs
      - name: Run Python browser tests with JUnit (Chromium only)
        env:
          BTK_BROWSER_ENGINES: chromium
        run: uv run --locked --no-dev --group browser-test python -m pytest tests/python -q -m browser --junitxml=test-results/junit/python-browser-3.15.xml
      - name: Preserve browser JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-browser-3.15
          path: test-results/junit/python-browser-3.15.xml
          if-no-files-found: error
          retention-days: 14
      - name: Validate Python API screenshots (Chromium)
        if: always()
        run: python tools/check_evidence.py test-results/python --pattern '*.json' --expect chromium-desktop,chromium-mobile
      - name: Python Playwright CLI screenshot (Chromium)
        run: |
          uv run --locked --no-dev --group browser-test python -m playwright screenshot --browser=chromium --device="Desktop Chrome" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-chromium.png
          python tools/check_png.py test-results/python-cli-chromium.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-browser-evidence
          path: |
            test-results
            !test-results/junit/**
            !test-results/controlled-failure/**
          if-no-files-found: error

  python-browser-optional:
    name: Python browser integration (Firefox and WebKit)
    needs: [changes, python, node-browserless, vendor-locked]
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Check system libraries (dry run, no changes)
        id: deps_check
        continue-on-error: true
        run: uv run --locked --no-dev --group browser-test python -m playwright install-deps --dry-run firefox webkit
      - name: System libraries (apt, bounded; runs only when the dry run reports missing packages)
        if: steps.deps_check.outcome == 'failure'
        timeout-minutes: 8
        run: |
          sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          uv run --locked --no-dev --group browser-test python -m playwright install-deps firefox webkit
      - name: Install browsers (first attempt)
        id: install_first
        continue-on-error: true
        timeout-minutes: 6
        run: uv run --locked --no-dev --group browser-test python -m playwright install firefox webkit
      - name: Install browsers (retry a stalled first attempt)
        if: steps.install_first.outcome == 'failure'
        timeout-minutes: 6
        run: uv run --locked --no-dev --group browser-test python -m playwright install firefox webkit
      - name: Run Firefox and WebKit browser tests with JUnit
        env:
          BTK_BROWSER_ENGINES: firefox,webkit
        run: uv run --locked --no-dev --group browser-test python -m pytest tests/python -q -m browser -k "firefox or webkit" --junitxml=test-results/junit/python-browser-optional-3.15.xml
      - name: Preserve Firefox and WebKit JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-python-browser-optional-3.15
          path: test-results/junit/python-browser-optional-3.15.xml
          if-no-files-found: error
          retention-days: 14
      - name: Validate Python API screenshots (Firefox and WebKit)
        if: always()
        run: python tools/check_evidence.py test-results/python --pattern '*.json' --expect firefox-desktop,firefox-mobile,webkit-desktop,webkit-mobile
      - name: Python Playwright CLI screenshot (WebKit)
        run: |
          uv run --locked --no-dev --group browser-test python -m playwright screenshot --browser=webkit --device="iPhone 13" --full-page "file://$GITHUB_WORKSPACE/fixtures/index.html" test-results/python-cli-webkit-mobile.png
          python tools/check_png.py test-results/python-cli-webkit-mobile.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-browser-optional-evidence
          path: |
            test-results
            !test-results/junit/**
            !test-results/controlled-failure/**
          if-no-files-found: error

  vendor-locked:
    name: Vendor locked baseline
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version: '26' }
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"
        python-version: "3.15"
        activate-environment: true
        enable-cache: false
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S tools/recreate_locked_vendor.py
    - run: uv run --locked python -m pytest tests/python -q -m "not browser"
    - name: Wrapper tests with btk-events plugin enabled
      run: |
        PYTHONPATH=tools uv run --locked python -m pytest tests/python/test_terminal_browser_wrapper.py -p pytest_btk_events --btk-events test-results/btk-events.jsonl --btk-events-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
    - name: Evidence board
      if: always()
      run: python tools/evidence_board.py test-results/btk-events.jsonl --step-summary
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: locked-btk-events
        path: test-results/btk-events.jsonl
        if-no-files-found: error
    - name: Scripts install and run as modules (python -m)
      run: |
        cd "$RUNNER_TEMP"
        uv run --locked --no-dev --no-editable --project "$GITHUB_WORKSPACE" python -m btk --help
    - name: Stage canonical vendor evidence
      if: always()
      run: >-
        python -S .vendor-sync-tools/vendor_stage.py
        --kind locked --output build/vendor-evidence-locked
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: locked-vendor-lock-py3.15
        path: build/vendor-evidence-locked
        if-no-files-found: error
        retention-days: 14
    timeout-minutes: 20


  failure-identity:
    needs: [changes, python, node-browserless, python-browser, python-browser-optional]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-python-3.15/python-3.15.xml", "junit-controlled-python-3.15/junit.xml", "junit-node-browserless/browserless-node.xml", "junit-python-browser-3.15/python-browser-3.15.xml", "junit-python-browser-optional-3.15/python-browser-optional-3.15.xml"]'
