[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-test-kit-tools"
version = "0.1.0"
description = "browser-test-kit's stdlib-only scripts, installed as top-level modules for `python -m <script>`"
requires-python = ">=3.9"

# Test-only. The default dev group is the browserless lane; browser adds Playwright.
# Floors stay open-ended (>=). Resolved versions are pinned in uv.lock.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "PyYAML>=6.0.3",
    "pip>=26.2",
]
browser = [
    "playwright>=1.63.0",
]

# The installed stdlib API remains 3.9+, but project/uv environments are 3.11+.
[tool.uv]
environments = ["python_version >= '3.11'"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
browser = { requires-python = ">=3.11" }

[tool.setuptools]
# Every scripts/*.py becomes a top-level module (src-layout discovery), so
# `python -m check_png ...` works from any directory after installation.
package-dir = { "" = "scripts" }

[tool.setuptools.data-files]
"share/browser-test-kit" = ["scripts/route_trail_node.mjs", "scripts/interaction.mjs", "scripts/mirror_facts.mjs", "scripts/hit_probe.mjs", "scripts/element_overlay.mjs", "scripts/probe_evidence.mjs", "scripts/probe_survey.mjs"]
"share/browser-test-kit/pillow_min" = ["vendor/pillow_min/pillow_min.py", "vendor/pillow_min/Ironmate-LICENSE"]
